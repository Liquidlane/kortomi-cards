<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Kortomi Cards</title>
  <meta name="description" content="Blackjack und Solitaire mit Kortomi, der frechsten Croupière der Unterwelt.">
  <meta name="theme-color" content="#170b20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kortomi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Grenze+Gotisch:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/progress.css">
  <link rel="stylesheet" href="css/baccarat.css">
  <link rel="stylesheet" href="css/winter.css">
  <link rel="stylesheet" href="css/patience.css">
  <link rel="stylesheet" href="css/slots.css">
  <link rel="stylesheet" href="css/college.css">
</head>
<body>
  <!-- Hintergrund: angedeutetes Casino-Diorama -->
  <div class="diorama" aria-hidden="true">
    <div class="scene">
      <div class="wall">
        <div class="arch a1"></div><div class="arch a2"></div><div class="arch a3"></div>
        <div class="neon-sign"><span>Kortomi</span><small>Casino &amp; Karten</small></div>
        <div class="curtain left"></div><div class="curtain right"></div>
      </div>
      <div class="floor"></div>
      <div class="slot s1"><i></i><b></b></div>
      <div class="slot s2"><i></i><b></b></div>
      <div class="slot s3"><i></i><b></b></div>
      <div class="slot s4"><i></i><b></b></div>
      <div class="roulette"><i></i></div>
      <div class="chandelier c1"></div>
      <div class="chandelier c2"></div>
    </div>
    <div class="bokeh"></div>
    <div class="vignette"></div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>

  <main id="app">
    <!-- LOBBY -->
    <section class="screen lobby" id="screen-lobby" data-active>
      <header class="topbar">
        <div class="balance-pill" title="Dein Guthaben"><span class="chip-ico"></span><span class="js-balance">1.000</span></div>
        <div class="topbar-actions">
          <button class="icon-btn" data-open="cloud" aria-label="Schon gespielt? Spielstand übertragen"></button>
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="lobby-body">
        <h1 class="logo"><span class="logo-main">Kortomi</span><span class="logo-sub">Cards</span></h1>
        <div class="lobby-host">
          <div class="mascot-slot" id="lobby-mascot"></div>
        </div>
        <nav class="game-picks">
          <button class="pick pick-bj" data-go="blackjack">
            <span class="pick-art" id="pick-art-bj"></span>
            <span class="pick-name">Blackjack</span>
            <span class="pick-desc">Gegen <span class="js-dealer-name">Kortomi</span>, 3 zu 2</span>
          </button>
          <button class="pick pick-sol" data-go="solitaire">
            <span class="pick-art" id="pick-art-sol"></span>
            <span class="pick-name">Solitaire</span>
            <span class="pick-desc">Klondike, ganz in Ruhe</span>
          </button>
          <button class="pick pick-hilo" data-go="hilo" hidden>
            <span class="pick-art" id="pick-art-hilo"></span>
            <span class="pick-name">Höher?</span>
            <span class="pick-desc">Höher oder tiefer raten</span>
          </button>
          <button class="pick pick-poker" data-go="poker" hidden>
            <span class="pick-art" id="pick-art-poker"></span>
            <span class="pick-name">Poker</span>
            <span class="pick-desc">Video-Poker, Buben+</span>
          </button>
          <button class="pick pick-baccarat" data-go="baccarat" hidden>
            <span class="pick-art" id="pick-art-baccarat"></span>
            <span class="pick-name">Baccarat</span>
            <span class="pick-desc">Spieler oder Bank?</span>
          </button>
          <button class="pick pick-spider" data-go="spider" hidden>
            <span class="pick-art" id="pick-art-spider"></span>
            <span class="pick-name">Spider</span>
            <span class="pick-desc">Zwei Decks, zehn Spalten</span>
          </button>
          <button class="pick pick-freecell" data-go="freecell" hidden>
            <span class="pick-art" id="pick-art-freecell"></span>
            <span class="pick-name">FreeCell</span>
            <span class="pick-desc">Alles offen, vier Zellen</span>
          </button>
          <button class="pick pick-slots" data-go="slots" hidden>
            <span class="pick-art" id="pick-art-slots"></span>
            <span class="pick-name">Spuk</span>
            <span class="pick-desc">Spielautomat, 5 Linien</span>
          </button>
        </nav>
        <div class="lobby-links">
          <button class="text-btn shop-link" data-open="shop"><span class="ico ico-shop"></span>Upgrade-Shop</button>
          <button class="text-btn daily-link" id="daily-btn" hidden><span class="ico ico-gift"></span>Tagesgeld abholen</button>
          <button class="text-btn chal-link" id="chal-btn"><span class="ico ico-chal"></span>Tagesaufgabe</button>
          <button class="text-btn" data-open="achievements"><span class="ico ico-trophy"></span>Erfolge <span class="js-ach-count"></span></button>
          <button class="text-btn" data-open="stats"><span class="ico ico-stats"></span>Statistik</button>
          <button class="text-btn" data-open="settings"><span class="ico ico-gear"></span>Einstellungen</button>
          <button class="text-btn cloud-link" data-open="cloud"><span class="ico ico-cloud"></span>Schon gespielt?</button>
        </div>
      </div>
    </section>

    <!-- BLACKJACK -->
    <section class="screen game" id="screen-blackjack">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="balance-pill"><span class="chip-ico"></span><span class="js-balance">1.000</span></div>
        <div class="topbar-actions">
          <button class="icon-btn hint-btn" id="bj-hint" aria-label="Tipp vom Croupier"></button>
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table bj-table" id="bj-table">
        <div class="felt">
          <svg class="felt-print" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs><path id="arc-bj" d="M140 250 Q500 470 860 250"/><path id="arc-bj2" d="M190 300 Q500 500 810 300"/></defs>
            <text class="felt-arc"><textPath href="#arc-bj" startOffset="50%" text-anchor="middle">Blackjack zahlt 3 zu 2</textPath></text>
            <text class="felt-arc small"><textPath href="#arc-bj2" startOffset="50%" text-anchor="middle"><tspan class="js-dealer-name">Kortomi</tspan> steht auf Soft 17 · Versicherung zahlt 2 zu 1</textPath></text>
          </svg>
        </div>
        <div class="bj-dealer-spot" id="bj-dealer"></div>
        <div class="shoe" id="bj-shoe"><div class="shoe-fill"></div></div>
        <div class="bet-circle" id="bj-bet"><span class="bet-amount"></span></div>
        <div class="cards-layer" id="bj-cards"></div>
        <div class="badges-layer" id="bj-badges"></div>
      </div>
      <footer class="controls bj-controls" id="bj-controls">
        <div class="chip-rack" id="bj-rack"></div>
        <div class="action-row" id="bj-actions"></div>
      </footer>
    </section>

    <!-- HÖHER ODER TIEFER (Shop) -->
    <section class="screen game" id="screen-hilo">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="balance-pill"><span class="chip-ico"></span><span class="js-balance">1.000</span></div>
        <div class="topbar-actions">
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table side-table" id="hl-table">
        <div class="felt">
          <svg class="felt-print" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs><path id="arc-hl" d="M160 470 Q500 600 840 470"/></defs>
            <text class="felt-arc small"><textPath href="#arc-hl" startOffset="50%" text-anchor="middle">Gleiche Karte zählt nicht · Ass ist niedrig</textPath></text>
          </svg>
        </div>
        <div class="side-dealer" id="hl-dealer"></div>
        <div class="cards-layer" id="hl-cards"></div>
        <div class="badges-layer" id="hl-badges"></div>
      </div>
      <footer class="controls bj-controls">
        <div class="chip-rack" id="hl-rack"></div>
        <div class="action-row" id="hl-actions"></div>
      </footer>
    </section>

    <!-- VIDEO-POKER (Shop) -->
    <section class="screen game" id="screen-poker">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="balance-pill"><span class="chip-ico"></span><span class="js-balance">1.000</span></div>
        <div class="topbar-actions">
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table side-table" id="vp-table">
        <div class="felt"></div>
        <div class="side-dealer" id="vp-dealer"></div>
        <div class="paytable" id="vp-pay" aria-label="Gewinntabelle"></div>
        <div class="cards-layer" id="vp-cards"></div>
        <div class="badges-layer" id="vp-badges"></div>
      </div>
      <footer class="controls bj-controls">
        <div class="chip-rack" id="vp-rack"></div>
        <div class="action-row" id="vp-actions"></div>
      </footer>
    </section>

    <!-- BACCARAT (Shop) -->
    <section class="screen game" id="screen-baccarat">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="balance-pill"><span class="chip-ico"></span><span class="js-balance">1.000</span></div>
        <div class="topbar-actions">
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table side-table bac-table" id="bac-table">
        <div class="felt"></div>
        <div class="side-dealer" id="bac-dealer"></div>
        <div class="bac-road" id="bac-road" aria-label="Letzte Ergebnisse"></div>
        <div class="bac-spots" id="bac-spots">
          <button class="bac-spot" data-side="P" aria-label="Auf Spieler setzen, zahlt 1 zu 1"><span class="bac-spot-name">Spieler</span><span class="bac-spot-pay">1 : 1</span><span class="bac-stack"></span><span class="bac-amt"></span></button>
          <button class="bac-spot" data-side="T" aria-label="Auf Unentschieden setzen, zahlt 8 zu 1"><span class="bac-spot-name">Unentschieden</span><span class="bac-spot-pay">8 : 1</span><span class="bac-stack"></span><span class="bac-amt"></span></button>
          <button class="bac-spot" data-side="B" aria-label="Auf Bank setzen, zahlt 1 zu 1, gewinnt die Bank mit 6 nur 1 zu 2"><span class="bac-spot-name">Bank</span><span class="bac-spot-pay">1 : 1<small>mit 6: 1 : 2</small></span><span class="bac-stack"></span><span class="bac-amt"></span></button>
        </div>
        <div class="cards-layer" id="bac-cards"></div>
        <div class="badges-layer" id="bac-badges"></div>
      </div>
      <footer class="controls bj-controls">
        <div class="chip-rack" id="bac-rack"></div>
        <div class="action-row" id="bac-actions"></div>
      </footer>
    </section>

    <!-- SPUKAUTOMAT (Shop) -->
    <section class="screen game" id="screen-slots">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="balance-pill"><span class="chip-ico"></span><span class="js-balance">1.000</span></div>
        <div class="topbar-actions">
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table side-table slm-table" id="sl-table">
        <div class="felt"></div>
        <div class="side-dealer" id="sl-dealer"></div>
        <div class="slm-pay" id="sl-pay" aria-label="Gewinntabelle"></div>
        <div class="slm-machine" id="sl-machine"></div>
        <div class="badges-layer" id="sl-badges"></div>
      </div>
      <footer class="controls bj-controls">
        <div class="chip-rack" id="sl-rack"></div>
        <div class="action-row" id="sl-actions"></div>
      </footer>
    </section>

    <!-- SOLITAIRE -->
    <section class="screen game" id="screen-solitaire">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="sol-meta">
          <span><i>Zeit</i><b id="sol-time">0:00</b></span>
          <span><i>Züge</i><b id="sol-moves">0</b></span>
          <span><i>Punkte</i><b id="sol-score">0</b></span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table sol-table" id="sol-table">
        <div class="felt"></div>
        <div class="slots-layer" id="sol-slots"></div>
        <div class="cards-layer" id="sol-cards"></div>
      </div>
      <footer class="controls sol-controls">
        <button class="ctl" id="sol-new"><span class="ico ico-new"></span>Neues Spiel</button>
        <button class="ctl" id="sol-undo"><span class="ico ico-undo"></span>Zurück</button>
        <button class="ctl" id="sol-hint"><span class="ico ico-bulb"></span>Tipp</button>
        <button class="ctl ctl-hot" id="sol-auto" hidden><span class="ico ico-magic"></span>Fertig legen</button>
      </footer>
      <div class="sol-mascot" id="sol-mascot"></div>
    </section>

    <!-- SPIDER (Shop) -->
    <section class="screen game pat-screen" id="screen-spider">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="sol-meta">
          <span><i>Zeit</i><b id="sp-time">0:00</b></span>
          <span><i>Züge</i><b id="sp-moves">0</b></span>
          <span><i>Punkte</i><b id="sp-score">500</b></span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table sol-table pat-table" id="sp-table">
        <div class="felt"></div>
        <div class="slots-layer" id="sp-slots"></div>
        <div class="cards-layer" id="sp-cards"></div>
      </div>
      <footer class="controls sol-controls">
        <button class="ctl" id="sp-new"><span class="ico ico-new"></span>Neues Spiel</button>
        <button class="ctl" id="sp-undo"><span class="ico ico-undo"></span>Zurück</button>
        <button class="ctl" id="sp-hint"><span class="ico ico-bulb"></span>Tipp</button>
        <button class="ctl" id="sp-deal"><span class="ico ico-magic"></span>Austeilen</button>
      </footer>
      <div class="sol-mascot" id="sp-mascot"></div>
    </section>

    <!-- FREECELL (Shop) -->
    <section class="screen game pat-screen" id="screen-freecell">
      <header class="topbar">
        <button class="icon-btn back" data-go="lobby" aria-label="Zur Lobby"></button>
        <div class="sol-meta">
          <span><i>Zeit</i><b id="fc-time">0:00</b></span>
          <span><i>Züge</i><b id="fc-moves">0</b></span>
          <span><i>Spiel</i><b id="fc-deal">#1</b></span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn js-sound" aria-label="Ton an/aus"></button>
          <button class="icon-btn" data-open="settings" aria-label="Einstellungen"></button>
        </div>
      </header>
      <div class="table sol-table pat-table" id="fc-table">
        <div class="felt"></div>
        <div class="slots-layer" id="fc-slots"></div>
        <div class="cards-layer" id="fc-cards"></div>
      </div>
      <footer class="controls sol-controls">
        <button class="ctl" id="fc-new"><span class="ico ico-new"></span>Neues Spiel</button>
        <button class="ctl" id="fc-undo"><span class="ico ico-undo"></span>Zurück</button>
        <button class="ctl" id="fc-hint"><span class="ico ico-bulb"></span>Tipp</button>
        <button class="ctl ctl-hot" id="fc-auto" hidden><span class="ico ico-magic"></span>Fertig legen</button>
      </footer>
      <div class="sol-mascot" id="fc-mascot"></div>
    </section>
  </main>

  <!-- Kortomi-Sprechblase (wird an das aktive Maskottchen geheftet) -->
  <div class="bubble" id="bubble" role="status" aria-live="polite"><p></p></div>

  <!-- Dialoge -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn close" id="sheet-close" aria-label="Schließen"></button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

  <script type="module" src="js/app.js"></script>
</body>
</html>
